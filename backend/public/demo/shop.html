<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DemoMart — Guided Tour Shop</title>
  <style>
    :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bg:#f7f8fa; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
    .bar { max-width:1040px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:20px; }
    .logo { font-weight:800; font-size:20px; color:var(--accent); letter-spacing:-0.5px; }
    nav.categories { display:flex; gap:16px; }
    nav.categories a { color:var(--muted); text-decoration:none; font-size:14px; padding:4px 2px; border-bottom:2px solid transparent; }
    nav.categories a:hover, nav.categories a.active { color:var(--ink); border-bottom-color:var(--accent); }
    main { max-width:1040px; margin:0 auto; padding:22px 20px 40px; }
    h1 { font-size:22px; margin:6px 0 2px; }
    .sub { color:var(--muted); font-size:14px; margin-bottom:18px; }
    .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
    @media (max-width: 860px){ .grid { grid-template-columns:repeat(2,1fr); } }
    .product-card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
    .product-card .thumb { height:120px; background:linear-gradient(135deg,#eef2ff,#e0e7ff); display:flex; align-items:center; justify-content:center; font-size:40px; }
    .product-card .body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; }
    .product-card .title { font-weight:650; font-size:15px; line-height:1.3; }
    .product-card .price { font-weight:800; color:var(--accent); font-size:16px; }
    .product-card .rating { color:#d97706; font-size:13px; }
    .product-card .stock { font-size:12px; color:var(--muted); }
    .product-card a.detail { margin-top:4px; font-size:13px; color:var(--accent); text-decoration:none; }
    .pager { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:26px; }
    .pager a, .pager span { font-size:14px; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; text-decoration:none; color:var(--ink); }
    .pager a.pagination-next { border-color:var(--accent); color:var(--accent); font-weight:650; }
    .pager .disabled { opacity:.4; }
    .pageinfo { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <span class="logo">DemoMart</span>
      <nav class="categories">
        <a href="?category=all" class="cat active" data-cat="all">All</a>
        <a href="?category=audio" class="cat" data-cat="audio">Audio</a>
        <a href="?category=home" class="cat" data-cat="home">Home</a>
        <a href="?category=outdoor" class="cat" data-cat="outdoor">Outdoor</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 id="heading">Featured products</h1>
    <div class="sub" id="subheading">A deterministic demo catalog for the guided tour.</div>
    <div class="grid" id="grid"></div>

    <div class="pager" id="pager"></div>
  </main>

  <script>
    /* Deterministic catalog: 3 pages of 8 items. Content depends only on the
       ?page / ?category params, so the guided tour behaves identically every
       time. */
    var EMOJI = ['🎧','🔊','🕯️','🛋️','⛺','🥾','🎒','☕','🪴','🧦','🔦','📻'];
    var NAMES = ['Wave', 'Nimbus', 'Pebble', 'Cedar', 'Summit', 'Trail', 'Harbor', 'Ember', 'Fern', 'Cove', 'Ridge', 'Loft'];
    var CATS  = ['audio','audio','home','home','outdoor','outdoor','audio','home','home','outdoor','outdoor','audio'];

    function params() {
      var p = new URLSearchParams(location.search);
      return { page: Math.max(1, parseInt(p.get('page') || '1', 10) || 1), category: p.get('category') || 'all' };
    }

    function productsFor(page) {
      // 8 items per page, deterministic by index.
      var out = [];
      var start = (page - 1) * 8;
      for (var i = 0; i < 8; i++) {
        var n = start + i;                 // absolute item index
        var e = EMOJI[n % EMOJI.length];
        var nm = NAMES[n % NAMES.length] + ' ' + (100 + n);
        var price = (19 + ((n * 7) % 80)) + '.99';
        var rating = (3 + ((n * 3) % 20) / 10).toFixed(1);
        var stock = ((n * 13) % 40) + 1;
        out.push({ id: n + 1, emoji: e, title: nm, price: price, rating: rating, stock: stock, cat: CATS[n % CATS.length] });
      }
      return out;
    }

    function render() {
      var q = params();
      var TOTAL_PAGES = 3;
      var items = productsFor(q.page);
      if (q.category !== 'all') items = items.filter(function (it) { return it.cat === q.category; });

      // category active state
      document.querySelectorAll('nav.categories a.cat').forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('data-cat') === q.category);
      });
      document.getElementById('heading').textContent =
        q.category === 'all' ? 'Featured products' : (q.category.charAt(0).toUpperCase() + q.category.slice(1) + ' products');

      var grid = document.getElementById('grid');
      grid.innerHTML = items.map(function (it) {
        return '<article class="product-card" data-id="' + it.id + '">'
          + '<div class="thumb">' + it.emoji + '</div>'
          + '<div class="body">'
          + '<div class="title">' + it.title + '</div>'
          + '<div class="price">$' + it.price + '</div>'
          + '<div class="rating">★ ' + it.rating + '</div>'
          + '<div class="stock">' + it.stock + ' in stock</div>'
          + '<a class="detail" href="?product=' + it.id + '">View details</a>'
          + '</div></article>';
      }).join('');

      // pager: keep category, change page. A real "Next" link so the
      // pagination detector finds it.
      var pager = document.getElementById('pager');
      var base = '?category=' + encodeURIComponent(q.category) + '&page=';
      var prev = q.page > 1
        ? '<a class="pagination-prev" href="' + base + (q.page - 1) + '">← Prev</a>'
        : '<span class="disabled">← Prev</span>';
      var next = q.page < TOTAL_PAGES
        ? '<a class="pagination-next" rel="next" href="' + base + (q.page + 1) + '">Next →</a>'
        : '<span class="disabled">Next →</span>';
      pager.innerHTML = prev + '<span class="pageinfo">Page ' + q.page + ' of ' + TOTAL_PAGES + '</span>' + next;
    }

    render();
  </script>
</body>
</html>
